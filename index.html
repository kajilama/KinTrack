  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Premium real-time family location tracker, geofencing, 30-day history, speed limit voice alerts, member chat, and emergency SOS." />
    <meta property="og:title" content="KinTrack Family" />
    <meta property="og:description" content="Premium real-time family location tracker, geofencing, 30-day history, speed limit voice alerts, member chat, and emergency SOS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="KinTrack Family" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Gracefully handle disabled HMR in AI Studio preview environment
      try {
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function (url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('hmr')))
            ) {
              return {
                readyState: 3, // CLOSED
                addEventListener() {},
                removeEventListener() {},
                send() {},
                close() {},
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      } catch (e) {}

      window.addEventListener(
        'error',
        function (e) {
          const msg = e.message || (e.error && e.error.message) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('vite') ||
            msg.includes('closed without opened')
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          const msg = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('vite') ||
            msg.includes('closed without opened')
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
